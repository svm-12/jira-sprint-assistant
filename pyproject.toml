[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-sprint-assistant"
version = "0.1.0"
description = "Jira sprint health checks and approval-gated reassignment, with an optional LLM-written standup brief."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "requests>=2.31"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
sprint-assistant = "sprint_assistant.cli:main"

[tool.setuptools]
packages = ["sprint_assistant"]
